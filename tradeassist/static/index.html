<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Assistant</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/gridstack.css">
<link rel="stylesheet" href="/ws.css">
</head>
<body data-app="workstation">
<header class="ws-top">
  <div class="ws-brand">Trade Assistant<small>3.1</small></div>
  <nav class="ws-tabs" id="ws-tabs" role="tablist" aria-label="Workspaces"></nav>
  <div class="ws-tools">
    <button class="ws-btn" id="ws-palette-btn" type="button" title="Find a stock or a command">Find <span class="ws-kbd">Ctrl K</span></button>
    <button class="ws-btn" id="ws-add" type="button" aria-haspopup="menu">Add widget</button>
    <button class="ws-btn" id="ws-layout" type="button" aria-haspopup="menu">Layout</button>
    <button class="ws-btn" id="ws-classic" type="button" aria-haspopup="menu">Classic screens</button>
    <button class="ws-btn" id="ws-lab-open" type="button" title="Replays, what the models learned, and their forward record (4.0)">Model Lab</button>
    <button class="ws-btn" id="ws-dock-toggle" type="button" aria-pressed="true">Hide dock</button>
    <span class="ws-save" id="ws-save" role="status" aria-live="polite" data-state="saved"></span>
  </div>
</header>
<div class="ws-status" id="ws-status" aria-live="polite">Connecting…</div>
<div class="ws-body">
  <main class="ws-tabsets" id="ws-tabsets"></main>
  <aside class="ws-dock" id="ws-dock" aria-label="Dock"></aside>
</div>
<div class="ws-overlay hidden" id="ws-palette">
  <div class="ws-palette" role="dialog" aria-label="Find a stock or a command">
    <input type="text" aria-label="Ticker or command" placeholder="Type a ticker, a workspace or a widget" autocomplete="off" spellcheck="false">
    <ul role="listbox" aria-label="Matches"></ul>
  </div>
</div>
<div class="ws-toast hidden" id="ws-toast" role="status"></div>
<script src="/flow.js"></script>
<script src="/app.js"></script>
<script src="/v2.js"></script>
<script src="/lab.js"></script>
<script src="/decide.js"></script>
<script src="/trades.js"></script>
<script src="/ideas.js"></script>
<script src="/morning.js"></script>
<script src="/live.js"></script>
<script src="/lwcharts.js"></script>
<script src="/chart.js"></script>
<script src="/whatif.js"></script>
<script src="/blend.js"></script>
<script src="/basket.js"></script>
<script src="/paper.js"></script>
<script src="/help.js"></script>
<script src="/gridstack.js"></script>
<script src="/ws-core.js"></script>
<script src="/ws-help.js"></script>
<script src="/ws-widgets.js"></script>
<script src="/ws-research.js"></script>
<script src="/ws-discover.js"></script>
<script src="/ws-desk.js"></script>
<script src="/ws-lab.js"></script>
</body>
</html>
